<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Бюджет{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top">
  <a class="brand" href="{{ url_for('dashboard') }}">Бюджет</a>
  <nav>
    {% set ep = request.endpoint %}
    <a href="{{ url_for('dashboard') }}" class="{{ 'active' if ep == 'dashboard' }}">Дашборд</a>
    <a href="{{ url_for('calendar_view') }}" class="{{ 'active' if ep in ('calendar_view', 'day_view') }}">Календарь</a>
    <a href="{{ url_for('expenses_view') }}" class="{{ 'active' if ep == 'expenses_view' }}">Операции</a>
    <a href="{{ url_for('settings_view') }}" class="{{ 'active' if ep == 'settings_view' }}">Настройки</a>
  </nav>
  <span class="spacer"></span>
  <a class="button primary" href="{{ url_for('day_view', day=today) }}#add">+ Трата</a>
</header>
<main>
  {% for category, message in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ category }}">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
