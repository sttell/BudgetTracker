[project]
name = "budget-tracker"
version = "0.1.0"
description = "Local personal budget tracker with an MCP interface for AI agents"
requires-python = ">=3.12"
dependencies = [
    "filelock>=4.0.10",
    "flask>=3.1.3",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pydantic>=2.13.5",
]

[project.scripts]
budget-mcp = "budget.mcp_server:main"
budget-web = "budget.web.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["budget"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
